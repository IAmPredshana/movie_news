server {
    listen 80;

    # заропсы по с /api/ отправляем на back-end
    location /api/ {
        proxy_pass http://backend:3000; # backend так как будет общая сеть
    }

    # для статики
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # для роутинга в реакт
        try_files $uri $uri/ /index.html;
    }
}