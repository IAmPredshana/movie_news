server {
    listen 80;
    client_max_body_size 20m;

    # заропсы по с /api/ отправляем на back-end
    location /api/ {
        proxy_pass http://backend:3000; # backend так как будет общая сеть
    }

    location /uploads/ {
	alias /usr/share/nginx/uploads/;
	expires 30d;
	access_log off;
    }

    # для статики
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # для роутинга в реакт
        try_files $uri $uri/ /index.html;
    }
}
