services:
  
  postgres:
    build: ./postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin  
      POSTGRES_DB: news         
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d news"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./back-end
    environment:
      
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_NAME: news
      REDIS_HOST: redis
      NODE_ENV: production
    volumes:
      - uploads_data:/app/uploads 
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build: ./front-end
    ports:
      - "80:80"
    volumes:
      - uploads_data:/usr/share/nginx/uploads
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
